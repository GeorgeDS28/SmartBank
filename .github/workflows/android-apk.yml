name: Android APK

# Tag a release (git tag v1.0.0 && git push --tags) to build an installable APK
# and attach it to the tag's GitHub Release. Run it manually from the Actions
# tab for a one-off build.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build release APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      # The API origin is compiled into the Dart snapshot, so it has to be known
      # at build time. Set API_BASE_URL under Settings -> Secrets and variables
      # -> Actions -> Variables; without it the APK talks to localhost.
      - name: Build
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          if [ -n "$API_BASE_URL" ]; then
            flutter build apk --release --dart-define=API_BASE_URL="$API_BASE_URL"
          else
            echo "::warning::API_BASE_URL variable is unset - the APK will point at http://localhost:8080"
            flutter build apk --release
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: smartbank-android
          path: mobile/build/app/outputs/flutter-apk/app-release.apk

      # Signed with the debug key (Flutter's default release config), so this
      # installs directly but is not eligible for Google Play.
      - name: Attach to the tag's release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          gh release create "$GITHUB_REF_NAME" "$APK" \
            --title "SmartBank $GITHUB_REF_NAME" \
            --generate-notes \
            || gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
