name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Spring Boot tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The only @SpringBootTest runs on the "test" profile, which swaps in an
      # in-memory H2 datasource, so no database service is needed here.
      - name: Test
        run: ./mvnw -B test

  mobile:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.4"
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build web bundle
        run: flutter build web --release

  # The backend's default datasource is MySQL, but the unit suite runs on H2,
  # and nothing in the other jobs builds or boots the image. This job checks
  # the Dockerfile, maps the schema onto a real MySQL, and exercises the
  # container's own HEALTHCHECK plus the HTTP contract of the running image.
  container-integration:
    name: Container image and API integration
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          # Throwaway password for a database that exists only for this job.
          MYSQL_ROOT_PASSWORD: ci-only-throwaway
          MYSQL_DATABASE: smartbank
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - uses: actions/checkout@v4

      - name: Build the image
        run: docker build -t "smartbank:${GITHUB_SHA}" backend/

      - name: Start it the way a platform would
        run: |
          # PORT is what Render-style platforms inject, so the job proves the
          # server.port binding rather than assuming it. The signing key is
          # generated per run and never committed or reused.
          JWT_SECRET="$(head -c 48 /dev/urandom | base64 | tr -d '\n')"

          docker run -d --name app --network=host \
            -e PORT=8080 \
            -e DB_URL='jdbc:mysql://127.0.0.1:3306/smartbank' \
            -e DB_USERNAME=root \
            -e DB_PASSWORD=ci-only-throwaway \
            -e JWT_SECRET="$JWT_SECRET" \
            "smartbank:${GITHUB_SHA}"

      - name: Wait for the image's own healthcheck
        run: |
          for _ in $(seq 1 60); do
            status="$(docker inspect --format \
              '{{if .State.Health}}{{.State.Health.Status}}{{else}}absent{{end}}' app)"
            case "$status" in
              healthy)
                echo "container reported healthy"
                exit 0 ;;
              unhealthy)
                echo "container went unhealthy"
                docker logs app
                exit 1 ;;
              absent)
                # Reached when the Dockerfile loses its HEALTHCHECK, which
                # would otherwise leave this loop guessing for the full 120s.
                echo "image declares no HEALTHCHECK; nothing to wait for"
                exit 1 ;;
            esac
            sleep 2
          done
          echo "still ${status:-unknown} after 120s"
          docker logs app
          exit 1

      - name: Integration tests
        run: |
          set -uo pipefail
          API='http://127.0.0.1:8080'
          OUT="$(mktemp -d)"
          # Unique per attempt so a rerun does not collide with its own
          # duplicate-email assertion.
          EMAIL="ci_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}@example.com"
          # Generated rather than written into a public file, so nothing here
          # is a credential even in appearance. The trailing a1! satisfies the
          # client-side mix of letter, digit and symbol.
          PASSWORD="$(head -c 12 /dev/urandom | base64 | tr -d '\n')a1!"
          failed=0

          # code_of <file> <curl args...>  -> writes body, echoes status code
          code_of() {
            local file="$1"; shift
            curl -s -o "$file" -w '%{http_code}' "$@" || true
          }

          # expect <label> <want> <got>
          expect() {
            if [ "$3" = "$2" ]; then
              echo "  ok   $1 -> $3"
            else
              echo "  FAIL $1 -> expected $2, got $3"
              cat "$OUT/body" 2>/dev/null || true
              failed=$((failed + 1))
            fi
          }

          # Every status below was measured against this build before being
          # asserted here; none of it is a guess.

          echo "Liveness"
          expect "health is open to anonymous probe" 200 \
            "$(code_of "$OUT/body" "$API/actuator/health")"
          grep -q '"status":"UP"' "$OUT/body" \
            || { echo "  FAIL health body: $(cat "$OUT/body")"; failed=$((failed + 1)); }
          expect "other actuator endpoints stay private" 403 \
            "$(code_of "$OUT/body" "$API/actuator/env")"

          echo "Registration"
          expect "valid user accepted" 200 "$(code_of "$OUT/body" -X POST "$API/api/auth/register" \
            -H 'Content-Type: application/json' \
            -d "{\"firstName\":\"Ci\",\"lastName\":\"Runner\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"phone\":\"9999999999\"}")"
          expect "duplicate email rejected" 409 "$(code_of "$OUT/body" -X POST "$API/api/auth/register" \
            -H 'Content-Type: application/json' \
            -d "{\"firstName\":\"Ci\",\"lastName\":\"Runner\",\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\",\"phone\":\"9999999999\"}")"
          expect "missing firstName rejected" 400 "$(code_of "$OUT/body" -X POST "$API/api/auth/register" \
            -H 'Content-Type: application/json' \
            -d "{\"lastName\":\"Runner\",\"email\":\"ci_shape_check@example.com\",\"password\":\"$PASSWORD\"}")"

          echo "Authentication"
          expect "wrong password rejected" 401 "$(code_of "$OUT/body" -X POST "$API/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"NotThePassword!\"}")"

          token="$(curl -s -X POST "$API/api/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$EMAIL\",\"password\":\"$PASSWORD\"}" \
            | grep -o '"token":"[^"]*"' | cut -d'"' -f4 || true)"
          if [ -n "$token" ]; then
            echo "  ok   login issued a JWT ($(printf '%s' "$token" | wc -c | tr -d ' ') chars)"
          else
            echo "  FAIL login issued no token"
            failed=$((failed + 1))
          fi

          echo "Authorised data access on a real MySQL datasource"
          expect "accounts without a token are refused" 403 \
            "$(code_of "$OUT/body" "$API/api/accounts")"
          expect "accounts with a token are served" 200 \
            "$(code_of "$OUT/body" -H "Authorization: Bearer $token" "$API/api/accounts")"

          if [ "$failed" -ne 0 ]; then
            echo "$failed integration assertion(s) failed"
            docker logs app
            exit 1
          fi
          echo "all integration assertions passed"

      - name: Dump application logs on failure
        if: failure()
        run: docker logs app 2>&1 | tail -60
