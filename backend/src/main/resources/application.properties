spring.application.name=smartbank-backend


# ===============================
# Server
# ===============================

# Container platforms such as Render inject PORT (10000 by default) and route
# only to that port. Unset locally, so the previous 8080 behaviour is unchanged.
server.port=${PORT:8080}


# ===============================
# Logging
# ===============================

logging.level.root=INFO
logging.level.com.smartbank=DEBUG
logging.level.org.springframework.security=INFO


# ===============================
# Database
# ===============================

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smartbank}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false


# ===============================
# JWT
# ===============================

jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION:86400000}


# ===============================
# Password reset email
# ===============================

# Sender address on a reset code email.
app.password-reset.from=${MAIL_FROM:}

# SMTP itself uses the standard Spring Boot mail properties, supplied from the
# environment: SPRING_MAIL_HOST, SPRING_MAIL_PORT, SPRING_MAIL_USERNAME,
# SPRING_MAIL_PASSWORD. They are deliberately not repeated here - Spring only
# creates a mail sender when spring.mail.host carries a value, so an empty
# default would hand out a sender that fails on every send.



